name: Waitlist watcher

on:
  schedule:
    - cron: "4,19,34,49 * * * *"   # every 15 min, off the :00/:15/:30/:45 rush when GitHub delays or drops runs
    - cron: "7 13 * * *"     # 13:07 UTC = 8:07 a.m. Eastern: the daily "still watching" push
  workflow_dispatch:          # "Run workflow" button, and the hook cron-job.org calls
    inputs:
      mode:
        description: "status = always send the OK push (testing); check = only push on news"
        default: "status"     # the button defaults to a visible test; cron-job.org sends "check"
        type: choice
        options: [status, check]

jobs:
  check:
    runs-on: ubuntu-latest   # GitHub's free Linux runner; Python 3 is preinstalled
    timeout-minutes: 3        # kill a hung run instead of letting it sit
    steps:
      - uses: actions/checkout@v4          # copy the repo (the script) onto the runner
      - name: Check the waitlist
        run: python3 watch_waitlist.py
        env:
          UF_TERM: ${{ vars.UF_TERM }}              # repo variable, e.g. 2271
          COURSE_CODES: ${{ vars.COURSE_CODES }}    # repo variable, comma-separated, e.g. COP4600,PHI3681
          CLASS_NUMBERS: ${{ vars.CLASS_NUMBERS }}  # repo variable, optional: only these sections of their course
          COURSE_CODE: ${{ vars.COURSE_CODE }}      # older single-course setting, still honored
          CLASS_NUMBER: ${{ vars.CLASS_NUMBER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}     # secret, so it's hidden in a public repo
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}  # secret, optional
          # Daily run sends the "OK" push; dispatched runs use their mode input; 15-minute runs stay quiet unless there's news.
          MODE: ${{ github.event.schedule == '7 13 * * *' && 'status' || inputs.mode || 'check' }}